
<!DOCTYPE html>
<html>
<head>
    <title>AI Voice Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
        }
        .status-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .status-dot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: pulse 2s infinite;
        }
        .status-dot.connecting { background: #ffc107; }
        .status-dot.connected { background: #28a745; }
        .status-dot.disconnected { background: #dc3545; animation: none; }
        .status-label {
            font-weight: 600;
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        .status-info {
            font-size: 14px;
            color: #666;
        }
        .notification {
            background: #4caf50;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            display: none;
            animation: slideIn 0.3s ease;
        }
        .notification.show {
            display: block;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-section {
            margin-top: 20px;
        }
        .chat-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
        }
        .chat-box h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #667eea;
            margin-bottom: 10px;
        }
        .chat-content {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
        }
        .user-transcript {
            background: #e3f2fd;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .ai-response {
            background: #f3e5f5;
            padding: 10px 15px;
            border-radius: 8px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        .empty-state {
            color: #999;
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-section">
            <div class="status-dot" id="statusDot"></div>
            <div class="status-label" id="statusLabel">Connecting...</div>
            <div class="status-info" id="statusInfo">Loading...</div>
        </div>

        <div class="notification" id="notification">
            🔊 Received audio from Deepgram
        </div>

        <div class="chat-section">
            <div class="chat-box">
                <h3>Your Transcript</h3>
                <div class="chat-content" id="transcriptContent">
                    <div class="empty-state">Speak to start...</div>
                </div>
            </div>

            <div class="chat-box">
                <h3>AI Response</h3>
                <div class="chat-content" id="responseContent">
                    <div class="empty-state">Waiting for response...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        // const SERVER_URL = params.get('server') || 'https://zoom-bot-zkf2.vercel.app';
        const SERVER_URL = params.get('server') || 'https://zoom-bot-pgyj.onrender.com';
        // const SERVER_URL = params.get('server') || 'http://localhost:3000';
        const PUSHER_KEY = params.get('pusher_key') || '53efc497795d6002deb2';
        const PUSHER_CLUSTER = params.get('pusher_cluster') || 'ap2';
        
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const statusInfo = document.getElementById('statusInfo');
        const transcriptContent = document.getElementById('transcriptContent');
        const responseContent = document.getElementById('responseContent');
        const notification = document.getElementById('notification');
        const eventId = params.get('eventId');

let sessionId;
if (eventId) {
    sessionId = 'session-' + eventId;  // ← Matches backend!
} else {
    sessionId = 'session-' + Math.random().toString(36).substr(2, 9);
}

        console.log('🆔 Session ID:', sessionId);
        console.log('🌐 Server:', SERVER_URL);

        function updateStatus(status, message) {
            statusDot.className = 'status-dot ' + status;
            statusLabel.textContent = message;
        }

        function showTranscript(text) {
            console.log('📝 Showing transcript:', text);
            transcriptContent.innerHTML = `<div class="user-transcript">${text}</div>`;
        }

        function showResponse(text) {
            console.log('🤖 Showing AI response:', text);
            responseContent.innerHTML = `<div class="ai-response">${text}</div>`;
        }

        function showNotification(message) {
            console.log('🔔 Notification:', message);
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ 
            sampleRate: 24000,
            latencyHint: 'interactive'
        });
        
        document.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });

        function base64ToAudioBuffer(base64Audio) {
            const binaryString = atob(base64Audio);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            const int16Array = new Int16Array(bytes.buffer);
            const float32Array = new Float32Array(int16Array.length);
            const scale = 1 / 32768;
            
            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] * scale;
            }
            
            return float32Array;
        }
async function playAudioImmediate(base64Audio, t0, format = 'pcm') {
    try {
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }
        
        if (format === 'mp3') {
            // Decode MP3 audio
            const binaryString = atob(base64Audio);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            
            const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer);
            
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioCtx.destination);
            
            // Notify backend when audio finishes
            source.onended = async () => {
                console.log('🔇 Audio playback finished - notifying backend');
                try {
                    await fetch(`${SERVER_URL}/api/audio-finished`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId })
                    });
                    console.log('✅ Backend notified that audio finished');
                } catch (error) {
                    console.error('❌ Failed to notify backend:', error);
                }
            };
            
            source.start(0);
            
        } else {
            // Original PCM handling (for Deepgram)
            const float32Array = base64ToAudioBuffer(base64Audio);
            const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 24000);
            audioBuffer.getChannelData(0).set(float32Array);
            
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioCtx.destination);
            
            source.onended = async () => {
                console.log('🔇 Audio playback finished - notifying backend');
                try {
                    await fetch(`${SERVER_URL}/api/audio-finished`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId })
                    });
                    console.log('✅ Backend notified that audio finished');
                } catch (error) {
                    console.error('❌ Failed to notify backend:', error);
                }
            };
            
            source.start(0);
        }
        
        const t_play = Date.now();
        const y = t_play - t0;
        
        console.log(`[${y}ms] ⚡ BROWSER STARTS PLAYING (T=Y)`);
        console.log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`);
        
    } catch (error) {
        console.error('PLAYBACK ERROR:', error);
    }
}

        async function connectToServer() {
            try {
                updateStatus('connecting', 'Connecting...');
                
                // Initialize Pusher
                console.log('📡 Initializing Pusher...');
                const pusher = new Pusher(PUSHER_KEY, {
                    cluster: PUSHER_CLUSTER,
                    forceTLS: true
                });
                
                const channelName = `session-${sessionId}`;
                console.log('📺 Subscribing to channel:', channelName);
                const channel = pusher.subscribe(channelName);
                
                channel.bind('pusher:subscription_succeeded', () => {
                    console.log('✅ Pusher subscription successful');
                });
                
           // Listen for interim transcripts (shows live updates)
channel.bind('transcript-interim', (data) => {
    console.log('📥 Received transcript-interim event:', data);
    if (data.text) {
        // Show interim in gray/italic style
        if (data.is_final && data.speech_final) {
            // Final transcript - bold style
            showTranscript(data.text);
        } else {
            // Interim transcript - show in lighter style
            transcriptContent.innerHTML = `<div class="user-transcript" style="opacity: 0.7; font-style: italic;">${data.text}</div>`;
        }
    }
});

// Listen for final transcript
channel.bind('transcript', (data) => {
    console.log('📥 Received final transcript event:', data);
    if (data.text) {
        showTranscript(data.text);
    }
});

// Listen for AI response
channel.bind('ai-response', (data) => {
    console.log('📥 Received AI response event:', data);
    if (data.text) {
        showResponse(data.text);
    }
});

// Listen for audio
channel.bind('audio-received', (data) => {
    console.log('📥 Received audio-received event:', data);
    showNotification('🔊 Received audio from Deepgram');
});
                // Connect to backend
                const response = await fetch(`${SERVER_URL}/api/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });
                
                if (!response.ok) throw new Error('Connection failed');
                
                console.log('✅ Connected to server');
                updateStatus('connected', 'Ready');
                statusInfo.textContent = 'Speak now';
                
               setInterval(async () => {
    try {
        const audioResponse = await fetch(`${SERVER_URL}/api/get-audio/${sessionId}`);
        const data = await audioResponse.json();
        
        if (data.audio && data.audio.length > 0 && data.t0) {
            for (const chunk of data.audio) {
                const format = chunk.format || 'pcm'; // Get format from backend
                await playAudioImmediate(chunk.audio || chunk, data.t0, format);
            }
        }
    } catch (error) {
        // Silent
    }
}, 100);
                
                // Get microphone
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 24000,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });
                
                const captureContext = new AudioContext({ sampleRate: 24000 });
                const source = captureContext.createMediaStreamSource(stream);
                const processor = captureContext.createScriptProcessor(4096, 1, 1);
                
                processor.onaudioprocess = async (event) => {
                    const inputData = event.inputBuffer.getChannelData(0);
                    const int16Data = new Int16Array(inputData.length);
                    
                    for (let i = 0; i < inputData.length; i++) {
                        const s = Math.max(-1, Math.min(1, inputData[i]));
                        int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    
                    const uint8Data = new Uint8Array(int16Data.buffer);
                    let binary = '';
                    for (let i = 0; i < uint8Data.length; i++) {
                        binary += String.fromCharCode(uint8Data[i]);
                    }
                    const base64Audio = btoa(binary);
                    
                    try {
                        await fetch(`${SERVER_URL}/api/send-audio`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ sessionId, audio: base64Audio })
                        });
                    } catch (error) {
                        // Silent
                    }
                };
                
                source.connect(processor);
                processor.connect(captureContext.destination);
                
            } catch (error) {
                console.error('ERROR:', error);
                updateStatus('disconnected', 'Error');
                statusInfo.textContent = error.message;
            }
        }

        connectToServer();
    </script>
</body>
</html>

    <script>
        const params = new URLSearchParams(window.location.search);
       // const SERVER_URL = params.get('server') || 'https://zoom-bot-zkf2.vercel.app';
        const SERVER_URL = params.get('server') || 'https://zoom-bot-pgyj.onrender.com';
        // const SERVER_URL = params.get('server') || 'http://localhost:3000';
        const PUSHER_KEY = params.get('pusher_key') || '53efc497795d6002deb2';
        const PUSHER_CLUSTER = params.get('pusher_cluster') || 'ap2';
        
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const statusInfo = document.getElementById('statusInfo');

        const responseContent = document.getElementById('responseContent');

            sessionId = 'session-' + eventId;
        } else {
            sessionId = 'session-' + Math.random().toString(36).substr(2, 9);
        }

        console.log('🆔 Session ID:', sessionId);
        console.log('🌐 Server:', SERVER_URL);

        function updateStatus(status, message) {
            statusDot.className = 'status-dot ' + status;
            statusLabel.textContent = message;
        }

        function showTranscript(text) {
            console.log('📝 Showing transcript:', text);
            transcriptContent.innerHTML = `<div class="user-transcript">${text}</div>`;
        }

        function showResponse(text) {
            console.log('🤖 Showing AI response:', text);
            responseContent.innerHTML = `<div class="ai-response">${text}</div>`;
        }

        function showNotification(message) {
            console.log('🔔 Notification:', message);
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ 
            sampleRate: 24000,
            latencyHint: 'interactive'
        });
        
        document.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });

        // ====================================================================
        // WEBSOCKET FOR AUDIO STREAMING
        // ====================================================================

        let audioWs = null;
        let audioQueue = [];
        let isPlayingQueue = false;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;

        function connectAudioWebSocket() {
            try {
                // Determine WebSocket URL
                const wsProtocol = SERVER_URL.startsWith('https') ? 'wss:' : 'ws:';
                const wsHost = SERVER_URL.replace('https://', '').replace('http://', '');
                const wsUrl = `${wsProtocol}//${wsHost}?sessionId=${sessionId}`;
                
                console.log('🔌 Connecting to WebSocket:', wsUrl);
                
                audioWs = new WebSocket(wsUrl);
                
                audioWs.onopen = () => {
                    console.log('✅ Audio WebSocket connected');
                    reconnectAttempts = 0;
                };
                
                audioWs.onmessage = async (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        console.log('📨 WebSocket message:', message.type);
                        
                        switch (message.type) {
                            case 'connected':
                                console.log('✅ WebSocket connection confirmed');
                                break;
                                
                            case 'audio-start':
                                console.log('🎵 Audio stream starting...');
                                audioQueue = [];
                                isPlayingQueue = false;
                                showNotification('🎵 Receiving audio...');
                                break;
                                
                            case 'audio-chunk':
                                console.log(`📦 Received audio chunk ${message.chunkNumber} (${message.chunkSize} bytes)`);
                                audioQueue.push(message.data);
                                
                                // Start playing if not already playing
                                if (!isPlayingQueue) {
                                    playNextChunkFromQueue();
                                }
                                break;
                                
                            case 'audio-end':
                                console.log(`✅ Audio stream complete: ${message.totalChunks} chunks, ${message.totalBytes} bytes`);
                                break;
                                
                            case 'audio-error':
                                console.error('❌ Audio stream error:', message.error);
                                showNotification('❌ Audio error: ' + message.error);
                                break;
                                
                            case 'pong':
                                // Heartbeat response
                                break;
                        }
                    } catch (error) {
                        console.error('❌ Error parsing WebSocket message:', error);
                    }
                };
                
                audioWs.onclose = (event) => {
                    console.log('🔌 WebSocket disconnected:', event.code, event.reason);
                    audioWs = null;
                    
                    // Attempt reconnection
                    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectAttempts++;
                        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 10000);
                        console.log(`🔄 Reconnecting in ${delay}ms... (attempt ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
                        setTimeout(connectAudioWebSocket, delay);
                    } else {
                        console.error('❌ Max reconnection attempts reached');
                        showNotification('❌ WebSocket connection failed');
                    }
                };
                
                audioWs.onerror = (error) => {
                    console.error('❌ WebSocket error:', error);
                };
                
            } catch (error) {
                console.error('❌ Error creating WebSocket:', error);
            }
        }

        async function playNextChunkFromQueue() {
            if (audioQueue.length === 0) {
                console.log('✅ All chunks played');
                isPlayingQueue = false;
                
                // Notify backend that audio finished
                if (audioWs && audioWs.readyState === WebSocket.OPEN) {
                    audioWs.send(JSON.stringify({
                        type: 'audio-finished',
                        timestamp: Date.now()
                    }));
                    console.log('📨 Sent audio-finished to backend');
                }
                
                return;
            }
            
            isPlayingQueue = true;
            const base64Chunk = audioQueue.shift();
            
            console.log(`🔊 Playing chunk (${audioQueue.length} remaining in queue)`);
            
            try {
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                
                // Decode MP3 chunk
                const binaryString = atob(base64Chunk);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer);
                
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioCtx.destination);
                
                // When this chunk finishes, play next chunk
                source.onended = () => {
                    console.log('✅ Chunk playback finished');
                    playNextChunkFromQueue();
                };
                
                source.start(0);
                
            } catch (error) {
                console.error('❌ Chunk playback error:', error);
                // Try next chunk even if this one failed
                playNextChunkFromQueue();
            }
        }

        // ====================================================================
        // MAIN CONNECTION SETUP
        // ====================================================================

        async function connectToServer() {
            try {
                updateStatus('connecting', 'Connecting...');
                
                // Initialize Pusher for transcripts
                console.log('📡 Initializing Pusher...');
                const pusher = new Pusher(PUSHER_KEY, {
                    cluster: PUSHER_CLUSTER,
                    forceTLS: true
                });
                
                const channelName = `session-${sessionId}`;
                console.log('📺 Subscribing to channel:', channelName);
                const channel = pusher.subscribe(channelName);
                
                channel.bind('pusher:subscription_succeeded', () => {
                    console.log('✅ Pusher subscription successful');
                });
                
                // Listen for transcripts
                channel.bind('transcript', (data) => {
                    console.log('📥 Received transcript event:', data);
                    if (data.text) {
                        showTranscript(data.text);
                    }
                });

                // Listen for AI responses
                channel.bind('ai-response', (data) => {
                    console.log('📥 Received AI response event:', data);
                    if (data.text) {
                        showResponse(data.text);
                    }
                });
                
                // Connect WebSocket for audio streaming
                connectAudioWebSocket();
                
                // Heartbeat to keep WebSocket alive
                setInterval(() => {
                    if (audioWs && audioWs.readyState === WebSocket.OPEN) {
                        audioWs.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 30000); // Every 30 seconds
                
                // Connect to backend
                const response = await fetch(`${SERVER_URL}/api/connect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });
                
                if (!response.ok) throw new Error('Connection failed');

                updateStatus('connected', 'Ready');
                statusInfo.textContent = 'Speak now';
                
                // Get microphone
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        channelCount: 1,
                        sampleRate: 24000,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });
                
                const captureContext = new AudioContext({ sampleRate: 24000 });
                const source = captureContext.createMediaStreamSource(stream);
                const processor = captureContext.createScriptProcessor(4096, 1, 1);
                
                processor.onaudioprocess = async (event) => {
                    const inputData = event.inputBuffer.getChannelData(0);
                    const int16Data = new Int16Array(inputData.length);
                    
                    for (let i = 0; i < inputData.length; i++) {
                        const s = Math.max(-1, Math.min(1, inputData[i]));
                        int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    
                    const uint8Data = new Uint8Array(int16Data.buffer);
                    let binary = '';
                    for (let i = 0; i < uint8Data.length; i++) {
                        binary += String.fromCharCode(uint8Data[i]);
                    }
                    const base64Audio = btoa(binary);
                    
                    try {
                        await fetch(`${SERVER_URL}/api/send-audio`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ sessionId, audio: base64Audio })
                        });
                    } catch (error) {
                        // Silent
                    }
                };
                
                source.connect(processor);
                processor.connect(captureContext.destination);
                
            } catch (error) {
                console.error('ERROR:', error);
                updateStatus('disconnected', 'Error');
                statusInfo.textContent = error.message;
            }
        }
